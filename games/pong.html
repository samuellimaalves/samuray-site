<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSB Retro Pong - XSB GAMES</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="games.css">
</head>
<body class="game-page">

    <header class="navbar">
        <nav class="nav-container">
            <a href="../index.html" class="logo-link">
                <img src="../img/XSB.jpg" alt="XSB GAMES Logo" class="nav-logo">
            </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="../games/" class="active">Games</a></li>
                <li><a href="../index.html#noticias">Notícias</a></li>
                <li><a href="../index.html#comunidade">Comunidade</a></li>
                <li><a href="../index.html#redes">Redes Sociais</a></li>
                <li><a href="../index.html#sobre">Sobre</a></li>
            </ul>

            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main class="game-container">
        <a href="../games/" class="back-link">← Voltar para o Catálogo de Games</a>
        <h1 class="game-title">XSB RETRO PONG</h1>
        <div class="score-board">
            Recorde: <span id="highScore">0</span> &nbsp;&nbsp;|&nbsp;&nbsp; Status: <span id="gameStatus">Pausado</span>
        </div>

        <canvas id="pongCanvas" width="600" height="400"></canvas>

        <button class="btn-action" id="startBtn">▶ / ⏸ Iniciar / Pausar</button>
        <div class="instructions" id="instructionsText">
            No PC: use W e S (ou Setas). No celular: toque e arraste o dedo na tela para mover a raquete!
        </div>
    </main>

    <script src="../script.js"></script>
    <script src="pong.js"></script>
</body>
</html>
