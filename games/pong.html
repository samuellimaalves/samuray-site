<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XSB Retro Pong - XSB GAMES</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Barra de Navegação Unificada */
        .navbar {
            background-color: #0b0b0b;
            border-bottom: 1px solid #1f1f1f;
            padding: 15px 20px;
            position: relative;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .logo-link {
            position: absolute;
            left: 0;
            display: flex;
            align-items: center;
        }

        .nav-logo {
            height: 40px;
            border-radius: 50%;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 25px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
            font-size: 0.95rem;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 24px;
            height: 16px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            position: absolute;
            right: 0;
            z-index: 1001;
        }

        .menu-toggle span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        /* Estilos do Jogo */
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .back-link {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 15px;
            display: inline-block;
        }

        .back-link:hover {
            color: #ffffff;
        }

        h1 {
            font-size: 1.8rem;
            margin: 5px 0 15px 0;
            letter-spacing: 1px;
        }

        .score-board {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .score-board span {
            color: #ff5555;
            font-weight: bold;
        }

        /* Canvas Responsivo para Celular e PC */
        canvas {
            background-color: #0b0b0b;
            border: 1px solid #222;
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            touch-action: none; /* Evita zoom indesejado ao tocar no canvas */
        }

        .btn-action {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: #d1d1d1;
        }

        .instructions {
            color: #737373;
            font-size: 0.85rem;
            margin-top: 15px;
            max-width: 400px;
            line-height: 1.4;
        }

        /* Responsividade Mobile do Header */
        @media (max-width: 768px) {
            .menu-toggle {
                display: flex;
            }

            .nav-links {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background-color: #0b0b0b;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 25px;
                font-size: 1.5rem;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.3s ease, visibility 0.3s ease;
            }

            .nav-links.active {
                opacity: 1;
                visibility: visible;
            }

            .menu-toggle.active span:nth-child(1) {
                transform: translateY(7px) rotate(45deg);
            }
            .menu-toggle.active span:nth-child(2) {
                transform: translateY(-7px) rotate(-45deg);
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navbar Unificada -->
    <header class="navbar">
        <nav class="nav-container">
            <a href="../index.html" class="logo-link">
                <img src="../img/XSB.jpg" alt="XSB GAMES Logo" class="nav-logo">
            </a>

            <ul class="nav-links" id="navLinks">
                <li><a href="../games/" class="active">Games</a></li>
                <li><a href="../index.html#noticias">Notícias</a></li>
                <li><a href="../index.html#comunidade">Comunidade</a></li>
                <li><a href="../index.html#redes">Redes Sociais</a></li>
                <li><a href="../index.html#sobre">Sobre</a></li>
            </ul>

            <button class="menu-toggle" id="menuToggle" aria-label="Menu">
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <div class="game-container">
        <a href="../games/" class="back-link">← Voltar para o Catálogo de Games</a>
        <h1>XSB RETRO PONG</h1>
        <div class="score-board">
            Recorde: <span id="highScore">0</span> &nbsp;&nbsp;|&nbsp;&nbsp; Status: <span id="gameStatus">Pausado</span>
        </div>

        <!-- Canvas do Jogo -->
        <canvas id="pongCanvas" width="600" height="400"></canvas>

        <button class="btn-action" id="startBtn">▶ / ⏸ Iniciar / Pausar</button>
        <div class="instructions" id="instructionsText">
            No PC: use W e S (ou Setas). No celular: toque e arraste o dedo na tela para mover a raquete!
        </div>
    </div>

    <!-- Script do Menu Mobile e do Jogo Pong -->
    <script>
        // Menu Mobile Toggle
        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            navLinks.classList.toggle('active');
        });

        document.querySelectorAll('.nav-links a').forEach(link => {
            link.addEventListener('click', () => {
                menuToggle.classList.remove('active');
                navLinks.classList.remove('active');
            });
        });

        // Lógica do Jogo Retro Pong com Suporte Touch
        const canvas = document.getElementById('pongCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const gameStatusEl = document.getElementById('gameStatus');
        const highScoreEl = document.getElementById('highScore');

        let gameRunning = false;
        let highScore = 0;

        const paddleWidth = 12, paddleHeight = 80;
        const player = { x: 20, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, score: 0 };
        const ai = { x: canvas.width - 32, y: canvas.height / 2 - paddleHeight / 2, width: paddleWidth, height: paddleHeight, score: 0 };
        const ball = { x: canvas.width / 2, y: canvas.height / 2, radius: 8, dx: 4, dy: 3 };

        let keys = {};

        // Controles de Teclado (PC)
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if ([' ', 'ArrowUp', 'ArrowDown', 'w', 's'].includes(e.key)) {
                if(e.target === document.body) e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        // Controles Touch (Celular - Arrastar na tela)
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touchY = e.touches[0].clientY - rect.top;
            const scaleY = canvas.height / rect.height;
            player.y = (touchY * scaleY) - (player.height / 2);
            
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
        }, { passive: false });

        // Suporte a mouse drag para testes no PC
        let isMouseDown = false;
        canvas.addEventListener('mousedown', () => { isMouseDown = true; });
        window.addEventListener('mouseup', () => { isMouseDown = false; });
        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            const rect = canvas.getBoundingClientRect();
            const mouseY = e.clientY - rect.top;
            const scaleY = canvas.height / rect.height;
            player.y = (mouseY * scaleY) - (player.height / 2);
            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;
        });

        startBtn.addEventListener('click', () => {
            gameRunning = !gameRunning;
            gameStatusEl.textContent = gameRunning ? "Jogando" : "Pausado";
            gameStatusEl.style.color = gameRunning ? "#55ff55" : "#ff5555";
            if (gameRunning) loop();
        });

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = -ball.dx;
        }

        function update() {
            if (!gameRunning) return;

            if (keys['w'] || keys['W'] || keys['ArrowUp']) {
                player.y -= 6;
            }
            if (keys['s'] || keys['S'] || keys['ArrowDown']) {
                player.y += 6;
            }

            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) player.y = canvas.height - player.height;

            // IA simples
            let aiCenter = ai.y + ai.height / 2;
            if (aiCenter < ball.y - 35) {
                ai.y += 3.5;
            } else if (aiCenter > ball.y + 35) {
                ai.y -= 3.5;
            }
            if (ai.y < 0) ai.y = 0;
            if (ai.y + ai.height > canvas.height) ai.y = canvas.height - canvas.height;

            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.dy = -ball.dy;
            }

            // Colisão Jogador
            if (
                ball.x - ball.radius < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                let deltaY = ball.y - (player.y + player.height / 2);
                ball.dx = Math.abs(ball.dx) + 0.2;
                ball.dy = deltaY * 0.15;
                ball.x = player.x + player.width + ball.radius;
            }

            // Colisão IA
            if (
                ball.x + ball.radius > ai.x &&
                ball.y > ai.y &&
                ball.y < ai.y + ai.height
            ) {
                let deltaY = ball.y - (ai.y + ai.height / 2);
                ball.dx = -(Math.abs(ball.dx) + 0.2);
                ball.dy = deltaY * 0.15;
                ball.x = ai.x - ball.radius;
            }

            // Pontuação
            if (ball.x < 0) {
                ai.score++;
                if (player.score > highScore) highScore = player.score;
                highScoreEl.textContent = highScore;
                resetBall();
            } else if (ball.x > canvas.width) {
                player.score++;
                if (player.score > highScore) highScore = player.score;
                highScoreEl.textContent = highScore;
                resetBall();
            }
        }

        function draw() {
            ctx.fillStyle = '#0b0b0b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linha central
            ctx.strokeStyle = '#222';
            ctx.setLineDash([5, 15]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            // Raquetes e Bola
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.fillRect(ai.x, ai.y, ai.width, ai.height);

            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Placar
            ctx.font = 'bold 48px -apple-system, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.textAlign = 'center';
            ctx.fillText(player.score, canvas.width / 4, 70);
            ctx.fillText(ai.score, (canvas.width / 4) * 3, 70);
        }

        function loop() {
            update();
            draw();
            if (gameRunning) {
                requestAnimationFrame(loop);
            }
        }

        draw();
    </script>
</body>
</html>
