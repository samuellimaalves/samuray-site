<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games - XSB GAMES</title>
    <style>
        /* Estilo idêntico ao da página inicial */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #0b0b0b;
            border-bottom: 1px solid #1f1f1f;
            padding: 15px 0;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 20px;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active {
            color: #ffffff;
        }
        /* Conteúdo do Catálogo */
        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 0 20px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: #ffffff;
            border-bottom: 2px solid #1f1f1f;
            padding-bottom: 10px;
        }
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #0b0b0b;
            border: 2px solid #1f1f1f;
            border-radius: 8px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .game-card:hover {
            border-color: #ffffff;
            transform: translateY(-4px);
        }
        .game-card h3 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.2rem;
        }
        .game-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .btn-jogar {
            display: inline-block;
            margin-top: 15px;
            background: #ffffff;
            color: #000000;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
        }
        .btn-jogar:hover {
            background: #cbd5e1;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="../index.html">
                <img src="../img/XSB.jpg" alt="Logo" style="height: 40px; border-radius: 50%;">
            </a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="index.html" class="active">Games</a></li>
                <li><a href="../noticias/">Notícias</a></li>
                <li><a href="../index.html#comunidade">Comunidade</a></li>
                <li><a href="../index.html#redes">Redes Sociais</a></li>
                <li><a href="../index.html#sobre">Sobre</a></li>
            </ul>
        </div>
    </header>

    <div class="container">
        <h1>Arcade & Jogos</h1>
        <div class="game-grid">
            <a href="pong.html" class="game-card">
                <div>
                    <h3>XSB Retro Pong</h3>
                    <p>O clássico jogo de tênis de mesa em estilo retrô. Teste seus reflexos contra a inteligência artificial!</p>
                </div>
                <span class="btn-jogar">Jogar Agora →</span>
            </a>
        </div>
    </div>

</body>
</html>
